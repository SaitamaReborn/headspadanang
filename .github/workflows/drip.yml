name: Daily drip build
on:
  schedule:
    - cron: "20 1 * * *"   # 01:20 UTC daily → publishes queued journal entries on their date
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node build.js
      - name: Commit & push if changed
        run: |
          git config user.name "drip-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "drip: $(date -u +%F)" && git push)
